# Project-scoped Sonar analysis configuration. Authentication and server details
# must be supplied by the environment; no user- or machine-level configuration
# is required.
sonar.projectKey=atomatom148-dotcom_ATOM
sonar.organization=atomatom148-dotcom
sonar.projectName=ATOM

sonar.sources=quant
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.exclusions=**/__pycache__/**
sonar.coverage.exclusions=tests/**
sonar.python.coverage.reportPaths=coverage.xml
