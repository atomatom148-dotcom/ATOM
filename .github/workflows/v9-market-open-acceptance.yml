name: V9 market-open acceptance

on:
  workflow_dispatch:
  schedule:
    # 14:35 UTC is after the US cash open in both EST and EDT.
    - cron: "35 14 * * 1-5"

concurrency:
  group: v9-market-open-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ATOM_MARKET_OPEN_ACCEPTANCE: "1"
      ATOM_PRODUCTION_BASE_URL: https://atom-v9-thin.onrender.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned acceptance dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all:
          -r .github/requirements/v9-market-open.txt
      - name: Run production-market database acceptance
        env:
          DATABASE_URL: ${{ secrets.ATOM_V9_ACCEPTANCE_READONLY_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          PYTHONPATH=. python -m pytest -q tests/test_v9_market_open_acceptance.py